name: Build TewPvP Nova Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-9.2.1/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
      - name: Clean and build from scratch
        run: gradle clean build --refresh-dependencies --no-daemon --stacktrace
      - name: Verify JAR output
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one runtime JAR, found ${#jars[@]}"
            printf '%s
' "${jars[@]}"
            exit 1
          fi
          test -s "${jars[0]}"
          unzip -t "${jars[0]}" >/dev/null
          echo "Verified: ${jars[0]}"
          echo "NOVA_JAR=${jars[0]}" >> "$GITHUB_ENV"
      - name: Upload one Nova JAR
        uses: actions/upload-artifact@v4
        with:
          name: TewPvP-Nova-Client-1.4.0
          path: ${{ env.NOVA_JAR }}
          if-no-files-found: error
          retention-days: 30
