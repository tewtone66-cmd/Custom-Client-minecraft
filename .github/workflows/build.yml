name: Build TewPvP Nova Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-9.2.1/bin" >> "$GITHUB_PATH"
      - name: Build once
        run: gradle clean build --no-daemon
      - name: Upload one Nova JAR
        uses: actions/upload-artifact@v4
        with:
          name: TewPvP-Nova-Client-1.1.0
          path: build/libs/tewpvp-nova-client-1.1.0.jar
          if-no-files-found: error
          retention-days: 30
