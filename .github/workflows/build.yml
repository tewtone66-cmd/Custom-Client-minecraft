name: Build TewPvP Custom Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.14-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.14/bin" >> "$GITHUB_PATH"

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TewPvP-Custom-Client
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
